<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGradient); }
    .grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 19px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .node-orbit {
      animation: rotateOrbit 25s linear infinite;
      transform-origin: 980px 180px;
    }
    .pulse-glow {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .data-flow-1 {
      stroke-dasharray: 8 12;
      animation: dashFlow 12s linear infinite;
    }
    .data-flow-2 {
      stroke-dasharray: 6 10;
      animation: dashFlowRev 15s linear infinite;
    }
    .floating-card {
      animation: float 6s ease-in-out infinite alternate;
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -200; }
    }
    @keyframes dashFlowRev {
      to { stroke-dashoffset: 200; }
    }
    @keyframes pulse {
      0% { opacity: 0.35; transform: scale(0.98); }
      100% { opacity: 0.85; transform: scale(1.02); }
    }
    @keyframes rotateOrbit {
      100% { transform: rotate(360deg); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Subtle Tech Grid Pattern -->
  <g class="grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Ambient Glow Spots (Background) -->
  <circle cx="200" cy="80" r="120" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="980" cy="180" r="160" fill="#6366f1" opacity="0.15" class="pulse-glow" filter="url(#glow)" />
  <circle cx="650" cy="280" r="100" fill="#c084fc" opacity="0.08" filter="url(#glow)" />

  <!-- Dynamic Animated Tech Visualization (Right Side / Background to Text) -->
  <g>
    <!-- Background Connection Waves -->
    <path d="M 680 180 C 760 100, 840 260, 980 180 C 1040 130, 1100 220, 1160 180" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.4" class="data-flow-1" />
    <path d="M 720 230 C 800 280, 890 90, 980 180 C 1050 250, 1110 120, 1180 160" 
          fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" class="data-flow-2" />

    <!-- Orbital System -->
    <circle cx="980" cy="180" r="110" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-dasharray="4 8" />
    <circle cx="980" cy="180" r="65" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />

    <!-- Central Cloud Core -->
    <g transform="translate(945, 145)">
      <rect width="70" height="70" rx="20" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" filter="url(#softGlow)" />
      <!-- Cloud Icon SVG inside -->
      <path d="M25 44 C20 44, 16 40, 16 35 C16 30.5, 19.5 27, 24 26.5 C25.5 20.5, 31 16, 37.5 16 C43.5 16, 48.5 20, 50.5 25.5 C54 26, 57 29, 57 33 C57 37.5, 53.5 41, 49 41 L25 41 Z" 
            fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Orbiting Satellite Nodes -->
    <g class="node-orbit">
      <!-- Node 1: S3 / Storage -->
      <g transform="translate(980, 70)">
        <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <circle cx="0" cy="0" r="5" fill="#38bdf8" />
      </g>
      <!-- Node 2: Sync / P2P -->
      <g transform="translate(1085, 215)">
        <circle cx="0" cy="0" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
        <circle cx="0" cy="0" r="4" fill="#818cf8" />
      </g>
      <!-- Node 3: Encryption / Shield -->
      <g transform="translate(885, 235)">
        <circle cx="0" cy="0" r="17" fill="#1e293b" stroke="#c084fc" stroke-width="2" />
        <circle cx="0" cy="0" r="4" fill="#c084fc" />
      </g>
    </g>
  </g>

  <!-- Foreground Content Area (Left / Center) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Category Tag -->
    <g transform="translate(0, 56)">
      <rect width="250" height="32" rx="16" fill="#1e293b" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" />
      <text x="32" y="21" class="badge-text">CURATED ENTERPRISE &amp; OSS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="148" class="title">
      Awesome Cloud Storage &amp;
    </text>
    <text x="0" y="198" class="title" fill="url(#primaryGrad)">
      Collaboration
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="246" class="subtitle">
      Enterprise EFSS • Self-Hosted File Sync • S3 Object Storage • Zero-Knowledge Sovereignty
    </text>

    <!-- Visual Feature Badges / Highlights in Foreground -->
    <g transform="translate(0, 276)">
      <!-- Feature 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
        <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">⚡ File Sync &amp; Share</text>
      </g>
      <!-- Feature 2 -->
      <g transform="translate(145, 0)">
        <rect width="145" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
        <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🔒 Data Sovereignty</text>
      </g>
      <!-- Feature 3 -->
      <g transform="translate(300, 0)">
        <rect width="145" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
        <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🤝 Real-Time Collab</text>
      </g>
      <!-- Feature 4 -->
      <g transform="translate(455, 0)">
        <rect width="125" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
        <text x="12" y="18" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">🛡️ Zero-Knowledge</text>
      </g>
    </g>
  </g>
</svg>
